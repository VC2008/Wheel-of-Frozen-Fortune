<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel of Frozen</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://use.typekit.net/mtm4vxw.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="https://use.typekit.net/mtm4vxw.css">
</head>
<body>
    <div class="container">
        <h1>Wheel of Frozen Fortune</h1>
        <h2>Spin the wheel to determine your FATE for the winter</h2>
        
        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="wheel-outer-ring"></div>
            <div class="wheel" id="wheel">
                <canvas id="wheelCanvas" width="500" height="500"></canvas>
            </div>
        </div>

        <div>
            <button class="spin-button" id="spinButton">SPIN THE WHEEL</button>
        </div>

        <div class="result-container" id="resultContainer">
            <div class="result-label">YOU LANDED ON:</div>
            <div class="result-value" id="resultValue"></div>
        </div>
    </div>
   <footer class="footer">
            <div class="footer-links">
                <a href="https://github.com/526agadre" target="_blank">
                    <i class="fab fa-github"></i> 
                </a>
                <a href="https://github.com/VC2008" target="_blank">
                    <i class="fab fa-github"></i>
                </a>
            </div>
        </footer>
<script src="script.js"></script>
</body>
</html>
